    <!-- JavaScript to load Navbar -->
    <script>
        fetch('./pages/navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar').innerHTML = data;
                markActivePage();
            });

        function markActivePage() {
          const path = window.location.pathname;
          const currentPage = path.substring(path.lastIndexOf('/') + 1);
          const links = document.querySelectorAll('.navbar a');

          links.forEach(link => {
              const linkPage = link.getAttribute('href');
              console.log(linkPage)
              if ((currentPage === "" || currentPage === "index.html") && linkPage.includes("index.html")) {
                  // If root path is accessed directly (like /bertoncini/), mark 'index.html' as active
                  link.classList.add('active');
              } else if (currentPage != "" && linkPage.includes(currentPage)) {
                  link.classList.add('active');
              } else {
                  link.classList.remove('active');
              }
          });
      }
    </script>
