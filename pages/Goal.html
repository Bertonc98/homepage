<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Progress tracking - Alberto Bertoncini">
    <title>Progress - Alberto Bertoncini</title>

    <link rel="icon" type="image/x-icon" href="/img/bassotto.ico">
    <link rel="icon" href="/img/bassotto.png" type="image/png">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.blue.min.css">
</head>

<body>

<!-- Navbar -->
<div id="navbar-content"></div>

<!-- Main Content -->
<section class="home-section">
    <div class="container">
        <h1>Progress</h1>

        <div id="goals-container"></div>
    </div>
</section>

<!-- Navbar Loader -->
<script>
    function markActivePage() {
				  const path = window.location.pathname;
				  const currentPage = path.substring(path.lastIndexOf('/') + 1);
				  console.log('PAGE:', currentPage);
				  const links = document.querySelectorAll('#navbar a');

				  links.forEach(link => {
					const idPage = link.getAttribute('id');
					console.log('ID:', idPage);

					if (currentPage.includes(idPage.replace('.html', ''))) {  // Strip .html for match
					  link.classList.remove('secondary');
					  link.classList.add('primary');
					} else {
					  link.classList.remove('primary');
					  link.classList.add('secondary');
					}
				  });
			  }
		// Load navbar
		fetch('/includes/navbar.html')
		  .then(response => response.text())
		  .then(html => {
			document.getElementById('navbar-content').innerHTML = html;
			markActivePage();  // Run after insert
		  })
		  .catch(err => console.error('Navbar load failed:', err));
</script>

<!-- Goals Loader -->
<script>
    fetch('/src/goals.json')
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('goals-container');

        data.forEach(goal => {

          const percent = goal.goal > 0
          ? Math.min((goal.progress / goal.goal) * 100, 100)
          : 0;

        const card = document.createElement('article');

        card.innerHTML = `
          <header>
            <strong>${goal.title}</strong><br>
            <small>${goal.category}</small>
          </header>

          <span aria-busy="true"> <progress value="${percent}" max="100"></progress> </span>

          <footer>
            <small>${goal.progress} / ${goal.goal} (${percent.toFixed(0)}%)</small>
          </footer>
        `;

        container.appendChild(card);
        });

        // animate after render
        setTimeout(() => {
          document.querySelectorAll(".progress-fill").forEach(el => {
            el.style.width = el.dataset.width + "%";
          });
        }, 100);
      });
</script>

</body>
</html>
