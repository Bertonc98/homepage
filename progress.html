---
layout: page
title: Progress
permalink: /progress/
description: Progress tracking - Alberto Bertoncini.
---

<div id="goals-container" class="goal-grid"></div>

<script>
  fetch('/src/goals.json')
    .then(response => response.json())
    .then(data => {
      const container = document.getElementById('goals-container');

      data.forEach(goal => {
        const percent = goal.goal > 0 ? Math.min((goal.progress / goal.goal) * 100, 100) : 0;
        const card = document.createElement('article');
        card.className = 'goal-card';
        card.innerHTML = `
          <header>
            <strong>${goal.title}</strong><br>
            <small>${goal.category}</small>
          </header>
          <progress value="${percent}" max="100"></progress>
          <footer>
            <small>${goal.progress} / ${goal.goal} (${percent.toFixed(0)}%)</small>
          </footer>
        `;
        container.appendChild(card);
      });
    });
</script>
